name: Practice Deployment
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install Dependencies
        runs: npm ci
      - name: Linting
        runs: npm run lint
      - name: Testing
        runs: npm test
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install Dependencies
        runs: npm ci
      - name: Build
        runs: npm run build
      - name: Deployment
        runs: echo "Deployment Step"
