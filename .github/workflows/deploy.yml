name: Practice Deployment
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install Dependencies
        run: npm ci
      - name: Linting
        run: npm run lint
      - name: Testing
        run: npm test
  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deployment
        run: echo "Deployment Step"
